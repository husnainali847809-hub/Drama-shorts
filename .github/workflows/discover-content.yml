name: Internet Cartoon & Story Discovery

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum candidates per discovery source (1-30)'
        required: true
        type: number
        default: 15

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install discovery dependency
        run: python -m pip install 'requests>=2.31.0'
      - name: Search licensed cartoon videos and popular story sources
        env:
          DISCOVERY_LIMIT: ${{ inputs.limit || 15 }}
        run: python discover_content.py --limit "$DISCOVERY_LIMIT"
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: internet-cartoon-story-discovery
          path: |
            output/content-discovery-*.json
            output/content-discovery-*.md
          if-no-files-found: error
          retention-days: 14