name: Internet Cartoon & Story Discovery

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum candidates per discovery source (1-30)'
        required: true
        type: number
        default: 15
      franchise:
        description: 'Famous cartoon name to search for openly licensed candidates (not official episodes)'
        required: true
        type: choice
        options:
          - all
          - Motu Patlu
          - Chhota Bheem
          - Tom and Jerry
          - Doraemon
          - Shinchan
          - Oggy and the Cockroaches
          - The Jungle Book (cartoon adaptations)
        default: all
      story:
        description: 'Famous classic story title to prioritize'
        required: true
        type: choice
        options:
          - all
          - Cinderella
          - Alice's Adventures in Wonderland
          - The Adventures of Pinocchio
          - The Wonderful Wizard of Oz
          - Peter Pan
          - The Jungle Book
          - Snow White
          - Hansel and Gretel
          - The Three Little Pigs
          - Robin Hood
          - The Little Mermaid
          - Arabian Nights
        default: all

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install discovery dependency
        run: python -m pip install 'requests>=2.31.0'
      - name: Search licensed cartoon videos and popular story sources
        env:
          DISCOVERY_LIMIT: ${{ inputs.limit || 15 }}
          DISCOVERY_FRANCHISE: ${{ inputs.franchise || 'all' }}
          DISCOVERY_STORY: ${{ inputs.story || 'all' }}
        run: |
          python discover_content.py --limit "$DISCOVERY_LIMIT" \
            --franchise "$DISCOVERY_FRANCHISE" --story "$DISCOVERY_STORY"
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: internet-cartoon-story-discovery
          path: |
            output/content-discovery-*.json
            output/content-discovery-*.md
          if-no-files-found: error
          retention-days: 14