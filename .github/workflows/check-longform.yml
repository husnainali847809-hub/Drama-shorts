name: Long-Form Cartoon Code Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'longform.py'
      - 'licensed_source.py'
      - 'discover_content.py'
      - 'licensed_assets.json'
      - 'requirements.txt'
      - '.github/workflows/check-longform.yml'
      - '.github/workflows/discover-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile main.py longform.py licensed_source.py discover_content.py
      - name: Test discovery text and license normalization
        run: python -c "import discover_content as d; assert d.clean('  two   words ') == 'two words'; assert d.normalize_video_license('CC BY-SA 4.0') == 'CC-BY-SA-4.0'; assert d.normalize_video_license('All rights reserved') is None; print('Discovery normalization checks OK.')"
      - name: Validate licensed asset manifest JSON
        run: python -c "import json; json.load(open('licensed_assets.json', encoding='utf-8')); print('Licensed asset manifest JSON OK.')"
      - name: Import long-form generator without credentials
        run: python -c "import longform, licensed_source, discover_content; print('Publisher, licensed-source and discovery modules import OK; no upload or publishing performed.')"
