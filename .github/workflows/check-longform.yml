name: Long-Form Cartoon Code Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'longform.py'
      - 'licensed_source.py'
      - 'discover_content.py'
      - 'external_video_discovery.py'
      - 'licensed_assets.json'
      - 'requirements.txt'
      - '.github/workflows/check-longform.yml'
      - '.github/workflows/discover-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile main.py longform.py licensed_source.py discover_content.py external_video_discovery.py
      - name: Test discovery selectors and license normalization
        run: |
          python - <<'PY'
          import discover_content as d
          import external_video_discovery as ext
          assert ext._license('https://creativecommons.org/licenses/by/4.0/') == 'CC-BY-4.0'
          assert ext._license('All rights reserved') is None
          # Internet Archive discovery must return candidates (not silently discard
          # them as an unconsumed generator) and filter known short clips.
          from unittest.mock import Mock, patch
          def fake_archive_get(url, params=None, **kwargs):
              response = Mock()
              response.raise_for_status = lambda: None
              if url == ext.IA_SEARCH:
                  response.json.return_value = {'response': {'docs': [
                      {'identifier': 'short-cartoon', 'title': 'Short cartoon', 'licenseurl': 'https://creativecommons.org/licenses/by/4.0/'},
                      {'identifier': 'full-cartoon', 'title': 'Full cartoon', 'licenseurl': 'https://creativecommons.org/licenses/by/4.0/'}
                  ]}}
              else:
                  identifier = url.rsplit('/', 1)[-1]
                  duration = '120' if identifier == 'short-cartoon' else '420'
                  response.json.return_value = {'files': [
                      {'name': identifier + '.mp4', 'length': duration, 'size': '1000'}
                  ]}
              return response
          with patch('external_video_discovery.requests.get', side_effect=fake_archive_get):
              ia_results = ext.discover_internet_archive(5, queries=['test animation'])
          ia_candidates = [x for x in ia_results if '_source_error' not in x]
          assert len(ia_candidates) == 1
          assert ia_candidates[0]['title'] == 'Full cartoon'
          assert ia_candidates[0]['duration_seconds'] == 420
          assert ia_candidates[0]['duration_status'] == 'meets_minimum_duration'
          assert ext.discover_youtube_creative_commons(3)['status'] == 'not_configured' if not __import__('os').getenv('YOUTUBE_API_KEY') else True
          assert d.clean('  two   words ') == 'two words'
          assert d.normalize_video_license('CC BY-SA 4.0') == 'CC-BY-SA-4.0'
          assert d.normalize_video_license('All rights reserved') is None
          assert 'Motu Patlu' in d.REFERENCE_ONLY_FRANCHISES
          assert 'Chhota Bheem' in d.REFERENCE_ONLY_FRANCHISES
          assert 'Cinderella' in d.CLASSIC_STORY_SEARCHES
          assert 'Alice\'s Adventures in Wonderland' in d.CLASSIC_STORY_SEARCHES
          assert d.animation_relevance('Joy & Heron Animated CGI Spot', '')[0] is True
          assert d.animation_relevance('Charge Blender Open Movie', '')[0] is True
          assert d.animation_relevance('Prison restoration documentary', '')[0] is False
          # Classic animation may be identified by Commons categories or known short titles.
          assert d.animation_relevance('Alice\'s Balloon Race (1926)', '')[0] is True
          assert d.animation_relevance('Betty Boop - A Language All My Own (1935)', '')[0] is True
          assert d.animation_relevance('The Bandmaster (1931)', '', ['Category:Animated films'])[0] is True
          # Game announcements/trailers are not reusable cartoon episodes.
          assert d.animation_relevance('Doraemon Story of Seasons PS4 Announcement', '')[0] is False
          assert d.animation_relevance('Oggy and the Cockroaches - THE MOVIE', '')[0] is True
          assert d.story_title_matches('Alice in Wonderland short animation', '', "Alice's Adventures in Wonderland") is False
          assert d.story_title_matches("Alice's Adventures in Wonderland animated film", '', "Alice's Adventures in Wonderland") is True
          # Open Library fallback records remain explicitly un-cleared for copyright.
          original_get_json = d.get_json
          d.get_json = lambda url, params=None, timeout=(8, 18): {
              'docs': [{'key': '/works/OL1W', 'title': 'Test Fairy Tale', 'author_name': ['A. Author'],
                        'first_publish_year': 1900, 'subject': ['Fairy tales'], 'edition_count': 3}]
          }
          fallback = d.discover_openlibrary_story_sources(5, searches=['fairy tales'])
          d.get_json = original_get_json
          assert len(fallback) == 1
          assert fallback[0]['rights_status'] == 'unknown_manual_copyright_review_required'
          try:
              d.build_report(1, franchise='not-a-real-franchise')
          except ValueError:
              pass
          else:
              raise AssertionError('Unknown franchise selection was accepted')
          print('Discovery selector and license checks OK.')
          PY
      - name: Validate licensed asset manifest JSON
        run: python -c "import json; json.load(open('licensed_assets.json', encoding='utf-8')); print('Licensed asset manifest JSON OK.')"
      - name: Import long-form generator without credentials
        run: python -c "import longform, licensed_source, discover_content; print('Publisher, licensed-source and discovery modules import OK; no upload or publishing performed.')"
