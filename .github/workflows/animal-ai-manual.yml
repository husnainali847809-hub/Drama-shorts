name: Animal AI — Cloud Pilot Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animal-ai-cloud-pilot
  cancel-in-progress: false

jobs:
  render-pilot:
    name: Render review-only animal pilot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify render tools
        run: |
          blender --version
          ffmpeg -version
          python -m py_compile main.py animal_ai/pipeline.py animal_ai/story.py

      - name: Generate the 3D animal pilot
        env:
          BLENDER_EXE: /usr/bin/blender
        run: python main.py --generate --pilot

      - name: Upload final review video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: animal-pilot-review
          path: |
            output/animal_pilot/PILOT_Timo_and_Bunny_REVIEW_ONLY.mp4
            output/animal_pilot/review_metadata.json
          if-no-files-found: error
          retention-days: 7
