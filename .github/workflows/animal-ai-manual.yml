name: Animal AI — Manual Setup Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify free pipeline
        run: |
          python -m py_compile main.py animal_ai/pipeline.py animal_ai/story.py
          ffmpeg -version
          echo "No fal.ai key required. Render locally on the creator's PC."
