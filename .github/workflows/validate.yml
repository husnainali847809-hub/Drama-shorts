name: Validate Movie Source Discovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run source-filter tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Wikimedia Commons discovery (no downloads or publishing)
        run: |
          python - <<'PY'
          from sources.movie_finder import _search_commons_movies
          items = _search_commons_movies(limit=100)
          print("Commons eligible candidates:", len(items))
          for item in items:
              print({
                  "title": item["title"],
                  "creator": item["creator"],
                  "license_url": item["license_url"],
                  "source_resolution": f'{item["source_width"]}x{item["source_height"]}',
                  "details_url": item["details_url"],
              })
          PY

      - name: Smoke-test mixed-content research and licensed image discovery
        run: |
          python - <<'PY'
          from mixed_content.research import get_research, find_licensed_images
          item = get_research("documentary", day_index=0)
          print("Research topic:", item["title"], item["source_url"])
          images = find_licensed_images(item["search_terms"], limit=3)
          print("Reusable licensed visuals:", len(images))
          for image in images:
              print(image["title"], image["license_url"], image["page_url"])
          PY
