name: Animated Jungle Preview (No Publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animated-jungle-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Generate animated preview only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main.py --preview

      - name: Save preview video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-jungle-preview
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 3
