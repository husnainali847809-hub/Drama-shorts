name: AI Realistic Drama Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-realistic-drama:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Magic Hour dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install magic_hour requests edge-tts

      - name: Generate realistic drama scenes and Urdu voices
        env:
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          MAGIC_HOUR_VIDEO_MODEL: ltx-2.5
          MAGIC_HOUR_RESOLUTION: 480p
        run: python demo/animated_drama_demo.py

      - name: Upload realistic drama demo
        uses: actions/upload-artifact@v4
        with:
          name: magic-hour-realistic-drama-demo
          path: demo_output/ai_realistic_drama_demo.mp4
          if-no-files-found: error
          retention-days: 7
