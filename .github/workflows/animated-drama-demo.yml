name: AI Anime Drama Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ai-anime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and AI demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install fal-client requests edge-tts

      - name: Generate AI anime scenes and Urdu voices
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python demo/animated_drama_demo.py

      - name: Upload AI anime demo
        uses: actions/upload-artifact@v4
        with:
          name: ai-anime-drama-demo
          path: demo_output/ai_anime_demo.mp4
          if-no-files-found: error
          retention-days: 7
