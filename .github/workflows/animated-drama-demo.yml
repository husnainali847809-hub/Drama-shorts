name: Original Animated Drama Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install demo-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow imageio-ffmpeg

      - name: Render original animated demo
        run: python demo/animated_drama_demo.py

      - name: Upload demo video artifact
        uses: actions/upload-artifact@v4
        with:
          name: original-animated-drama-demo
          path: demo_output/animated_drama_demo.mp4
          if-no-files-found: error
          retention-days: 7
