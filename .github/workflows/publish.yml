name: Pakistani Drama Clips Automation

on:
  schedule:
    # Four daily runs: 09:00, 13:00, 17:00, 21:00 Pakistan Standard Time (UTC+5)
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pakistani-drama-clips-buffer
  cancel-in-progress: false

jobs:
  create-and-queue:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_AUTO_PUBLISH == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore processed episode history
        uses: actions/cache@v4
        with:
          path: state/processed.json
          key: drama-history-${{ github.run_id }}
          restore-keys: |
            drama-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Deno JavaScript runtime for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies and current yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --upgrade "yt-dlp[default]"
          yt-dlp --version
          deno --version
          python -c "import imageio_ffmpeg; print('Bundled FFmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Discover recent videos from local Pakistani drama channels (discovery only)
        run: python discover_local_sources.py

      - name: Find, edit and queue one authorized drama clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_CHANNEL_NAME: ${{ vars.BUFFER_EXPECTED_CHANNEL_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: pakistani-drama-clips
          CLIP_SECONDS: '60'
          SCENE_PREFERENCE: ${{ vars.SCENE_PREFERENCE }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
        run: python drive_main.py

      - name: Save generated clip for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-clip-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 5
