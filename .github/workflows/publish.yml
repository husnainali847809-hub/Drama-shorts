name: Hindi Mixed Content - Facebook Buffer Publisher

on:
  schedule:
    # 08:00, 11:00, 14:00, 17:00, 20:00 Pakistan Standard Time (UTC+5)
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Set true to generate one Hindi Reel and add it to the Animated Jungle Buffer queue"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hindi-mixed-content-facebook-buffer
  cancel-in-progress: false

jobs:
  create-and-queue:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore mixed-content history
        uses: actions/cache@v4
        with:
          path: history.sqlite3
          key: mixed-content-history-${{ github.run_id }}
          restore-keys: |
            mixed-content-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python and source filters
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Generate Hindi mixed-content Reel and queue to Animated Jungle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          HINDI_TTS_VOICE: hi-IN-SwaraNeural
          MIXED_SLOT_CRON: ${{ github.event.schedule || '' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_CHANNEL_NAME: Animated Jungle
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLIP_MIN_SECONDS: "85"
          CLIP_MAX_SECONDS: "89"
        run: python -m mixed_content.main

      - name: Save generated video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindi-mixed-reel-${{ github.run_id }}
          path: output/mixed_content/
          if-no-files-found: ignore
          retention-days: 5
