name: Long-Form Cartoon Daily Publisher

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Set true only when you want to queue one rights-reviewed licensed Facebook cartoon video'
        required: true
        type: boolean
        default: false
      source_mode:
        description: 'Use a manually reviewed, commercially reusable internet cartoon video'
        required: true
        type: choice
        options:
          - licensed
        default: licensed

permissions:
  contents: write

concurrency:
  group: funny-animals-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check Python source syntax
        run: python -m py_compile main.py longform.py licensed_source.py
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare complete licensed cartoon video, upload, and queue Facebook video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_CHANNEL_NAME: ${{ vars.BUFFER_EXPECTED_CHANNEL_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: funny-animals-comedy
          CARTOON_SOURCE_MODE: ${{ inputs.source_mode || 'licensed' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python main.py
