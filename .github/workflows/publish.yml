name: Pakistani Drama Clips Automation

on:
  schedule:
    # Four queue runs daily at 09:00, 13:00, 17:00 and 21:00 Pakistan time.
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pakistani-drama-clips-buffer
  cancel-in-progress: false

jobs:
  create-and-queue:
    # Existing four daily Pakistan-time queue slots are preserved.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore processed episode history
        uses: actions/cache@v4
        with:
          path: state/processed.json
          key: drama-history-${{ github.run_id }}
          restore-keys: |
            drama-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies and current yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --upgrade "yt-dlp[default]"
          yt-dlp --version
          python -c "import imageio_ffmpeg; print('Bundled FFmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Find latest authorized TikTok video, edit and queue one Facebook Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_CHANNEL_NAME: ${{ vars.BUFFER_EXPECTED_CHANNEL_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: pakistani-drama-clips
          CLIP_SECONDS: '60'
          SCENE_PREFERENCE: ${{ vars.SCENE_PREFERENCE }}
        run: python main.py

      - name: Save generated clip for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-clip-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 5
