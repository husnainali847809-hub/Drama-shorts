name: Pakistani Drama Clips Automation

on:
  schedule:
    # Four queue runs daily at 07:00, 13:00, 17:00 and 21:00 Pakistan time.
    - cron: "0 2 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pakistani-drama-clips-buffer
  cancel-in-progress: false

jobs:
  create-and-queue:
    # Existing four daily Pakistan-time queue slots are preserved.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies and current yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --upgrade "yt-dlp[default]"
          yt-dlp --version

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Rank trending videos, download the top available candidate unchanged and queue one Facebook Reel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_CHANNEL_NAME: ${{ vars.BUFFER_EXPECTED_CHANNEL_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Persist duplicate-prevention history
        if: success()
        run: |
          # Force-add so history is persisted even if a future ignore rule is added.
          git add -f state/processed.json
          if git diff --cached --quiet -- state/processed.json; then
            echo "No history changes to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update processed drama video history"
            git push
          fi

      - name: Save generated clip for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-clip-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 5
