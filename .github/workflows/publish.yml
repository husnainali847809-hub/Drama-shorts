name: Movie Reels - Facebook Buffer Publisher

on:
  schedule:
    # 08:00, 11:00, 14:00, 17:00, 20:00 Pakistan Standard Time (UTC+5)
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Set true to process one licensed movie scene and add it to Buffer"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: movie-reels-facebook-buffer
  cancel-in-progress: false

jobs:
  create-and-queue:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore used-film history
        uses: actions/cache@v4
        with:
          path: history.sqlite3
          key: movie-reels-history-${{ github.run_id }}
          restore-keys: |
            movie-reels-history-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Process one licensed movie scene and queue as a Facebook Reel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_CHANNEL_NAME: ${{ vars.BUFFER_EXPECTED_CHANNEL_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: movie-reels-publisher
          CLIP_MIN_SECONDS: "85"
          CLIP_MAX_SECONDS: "89"
          MAX_SOURCE_MB: "800"
          IA_SEARCH_ROWS: "500"
          IA_SEARCH_PAGES: "2"
          COMMONS_SEARCH_LIMIT: "100"
        run: python main.py
      - name: Save generated video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-reel-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 3
